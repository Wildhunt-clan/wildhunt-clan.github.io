<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild Hunt — клановый штаб Godforge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox=%220%200%2064%2064%22%20aria-hidden=%22true%22%3E%0A%3Cdefs%3E%0A%3ClinearGradient%20id=%22shg%22%20x1=%220%22%20y1=%220%22%20x2=%220%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22#3a2f1c%22/%3E%3Cstop%20offset=%22.55%22%20stop-color=%22#241a10%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22#120c06%22/%3E%3C/linearGradient%3E%0A%3ClinearGradient%20id=%22blg%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22#f4d488%22/%3E%3Cstop%20offset=%22.5%22%20stop-color=%22#c8963e%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22#8a5a1e%22/%3E%3C/linearGradient%3E%0A%3ClinearGradient%20id=%22blg2%22%20x1=%221%22%20y1=%220%22%20x2=%220%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22#f4d488%22/%3E%3Cstop%20offset=%22.5%22%20stop-color=%22#c8963e%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22#8a5a1e%22/%3E%3C/linearGradient%3E%0A%3C/defs%3E%0A%3Cpath%20d=%22M32%203%2055%2011v21c0%2016-14%2026-23%2029C23%2058%209%2048%209%2032V11Z%22%20fill=%22url%28#shg%29%22%20stroke=%22#c8963e%22%20stroke-width=%222.5%22/%3E%0A%3Cpath%20d=%22M32%208%2050%2014.5v17.5C50%2044.5%2039%2052.5%2032%2055.5%2025%2052.5%2014%2044.5%2014%2032V14.5Z%22%20fill=%22none%22%20stroke=%22#6b4c1d%22%20stroke-width=%221.4%22/%3E%0A%3Cg%20stroke-linecap=%22round%22%3E%3Cpath%20d=%22M20%2020%2044%2044%22%20stroke=%22url%28#blg%29%22%20stroke-width=%224.6%22/%3E%3Cpath%20d=%22M44%2020%2020%2044%22%20stroke=%22url%28#blg2%29%22%20stroke-width=%224.6%22/%3E%3C/g%3E%0A%3Cg%20fill=%22#3f2d10%22%20stroke=%22#c8963e%22%20stroke-width=%221.4%22%3E%3Crect%20x=%2215.2%22%20y=%2239.2%22%20width=%2210%22%20height=%224.6%22%20rx=%221.6%22%20transform=%22rotate%2845%2020.2%2041.5%29%22/%3E%3Crect%20x=%2238.8%22%20y=%2239.2%22%20width=%2210%22%20height=%224.6%22%20rx=%221.6%22%20transform=%22rotate%28-45%2043.8%2041.5%29%22/%3E%3C/g%3E%0A%3Cg%20fill=%22#f4d488%22%3E%3Ccircle%20cx=%2219%22%20cy=%2246%22%20r=%222.6%22/%3E%3Ccircle%20cx=%2245%22%20cy=%2246%22%20r=%222.6%22/%3E%3C/g%3E%0A%3Cpath%20d=%22M32%2012l3.4%206.4L32%2022l-3.4-3.6Z%22%20fill=%22#e04b2f%22/%3E%0A%3Cpath%20d=%22M32%2012l3.4%206.4H28.6Z%22%20fill=%22#ff7a45%22/%3E%0A%3C/svg%3E">
<style>
:root{
  --bg:#0d0b08; --bg2:#14100b; --panel:#1b150e; --panel2:#221a10;
  --line:#3a2c18; --gold:#c8963e; --gold2:#f4d488; --text:#e8dcc4; --dim:#a39377;
  --leg:#d4a94e; --epic:#a86fe0; --rare:#4e9dd4; --acc:#e04b2f; --green:#7dd957;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 50% -100px,#241a0e 0%,var(--bg) 60%) fixed,var(--bg);
 color:var(--text);font:15px/1.55 system-ui,'Segoe UI',Roboto,sans-serif;min-height:100vh}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif;letter-spacing:.02em}
a{color:var(--gold2)}
::selection{background:#c8963e55}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* header */
header{position:sticky;top:0;z-index:50;background:linear-gradient(#1a130bd8,#120d07f0);backdrop-filter:blur(6px);
 border-bottom:1px solid var(--line);box-shadow:0 4px 24px #000a}
.hrow{display:flex;align-items:center;gap:14px;padding:10px 0}
.crest{width:52px;height:52px;filter:drop-shadow(0 0 8px #c8963e55)}
.hname{font-size:24px;color:var(--gold2);outline:none;border-bottom:1px dashed transparent;cursor:text}
.hname:hover,.hname:focus{border-bottom-color:#c8963e66}
.hslogan{font-size:12.5px;color:var(--dim);font-style:italic;outline:none;cursor:text}
.hslogan:hover,.hslogan:focus{color:var(--text)}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:0 0 8px}
nav button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 14px;border-radius:8px;
 cursor:pointer;font-size:14.5px;font-family:Georgia,serif;letter-spacing:.03em;transition:.15s}
nav button:hover{color:var(--gold2);border-color:var(--line)}
nav button.on{color:var(--gold2);border-color:var(--gold);background:#c8963e14}

/* общие */
section.tab{display:none;padding:22px 0 60px}
section.tab.on{display:block}
.panel{background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.panel+.panel{margin-top:14px}
.panel h3{color:var(--gold2);margin-bottom:10px;font-size:17px}
.muted{color:var(--dim)}
.big{font-size:26px;color:var(--gold2);font-family:Georgia,serif}
.statrow{display:flex;gap:14px;flex-wrap:wrap}
.statcard{flex:1 1 130px;text-align:center;padding:14px 10px;background:#00000042;border:1px solid var(--line);border-radius:10px}
.statcard .n{font-size:28px;color:var(--gold2);font-family:Georgia,serif}
.statcard .l{font-size:12.5px;color:var(--dim)}
input,select,textarea{background:#0f0c07;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
button.btn{background:linear-gradient(#c8963e,#8a5a1e);color:#1a120a;border:none;border-radius:8px;padding:8px 16px;
 font:600 14px system-ui;cursor:pointer;box-shadow:0 2px 10px #0008;transition:.15s}
button.btn:hover{filter:brightness(1.12)}
button.btn.ghost{background:#241a10;border:1px solid var(--line);color:var(--text)}
button.btn.mini{padding:3px 9px;font-size:12.5px}
button.btn.danger{background:linear-gradient(#8a2c1e,#5a1c10);color:#ffd9c4}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;border:1px solid}
.Legendarный,.r-Легендарный{color:#f4d488;border-color:#d4a94e88;background:#d4a94e14}
.r-Эпический{color:#d9b8ff;border-color:#a86fe088;background:#a86fe014}
.r-Редкий{color:#9fd0f0;border-color:#4e9dd488;background:#4e9dd414}
.tierbadge{display:inline-block;min-width:44px;text-align:center;padding:3px 10px;border-radius:8px;font-weight:700;font-family:Georgia,serif}
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolrow input,.toolrow select{min-width:150px}

/* карточки героев */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hcard{background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--line);border-left:4px solid var(--leg);
 border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s;position:relative}
.hcard.epic{border-left-color:var(--epic)} .hcard.rare{border-left-color:var(--rare)}
.hcard:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 6px 18px #000a}
.hcard h4{color:var(--gold2);font-size:16.5px;font-family:Georgia,serif}
.hcard .sub{font-size:12px;color:var(--dim)}
.hcard .rows{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12.5px}
.mini{display:inline-block;padding:2px 8px;border-radius:6px;background:#ffffff10;font-size:11.5px;color:var(--text)}
.hcard .tb{position:absolute;top:10px;right:10px;font-size:12px}
@keyframes wakeUp{0%{opacity:0;transform:translateY(8px) scale(.97)}55%{box-shadow:0 0 22px rgba(255,213,74,.35)}100%{opacity:1;transform:none;box-shadow:0 0 0 rgba(255,213,74,0)}}
.hcard{animation:wakeUp .5s ease both}
@media(prefers-reduced-motion:reduce){.hcard{animation:none}}

/* герой-страница */
.overlay{position:fixed;inset:0;background:#000000d8;z-index:100;overflow-y:auto;display:none}
.overlay.on{display:block}
.hpage{max-width:900px;margin:24px auto;background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--line);
 border-radius:14px;padding:26px 30px 40px;position:relative}
.hpage .close{position:absolute;top:12px;right:14px;font-size:22px;background:none;border:none;color:var(--dim);cursor:pointer}
.hpage .close:hover{color:var(--gold2)}
.hpage h2{color:var(--gold2);font-size:26px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.stcell{background:#00000040;border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.stcell .v{color:var(--gold2);font-size:17px;font-weight:600}
.stcell .k{font-size:11.5px;color:var(--dim)}
.ablock{border-left:3px solid var(--line);padding:8px 12px;margin:8px 0;background:#00000030;border-radius:0 8px 8px 0}
.awstep{color:var(--gold2);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid #2c2214;text-align:left;vertical-align:top}
th{color:var(--gold2);font-family:Georgia,serif;font-weight:600;position:sticky;top:0;background:var(--panel2)}
tr:hover td{background:#ffffff06}

/* тир-лист */
.tiersection{margin:18px 0}
.tierhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tiername{font-size:22px;font-family:Georgia,serif;color:var(--gold2)}
.tierlabel{color:var(--dim);font-size:13.5px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tcard{background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s}
.tcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.tcard .top{display:flex;align-items:center;gap:10px}
.tcard .score{margin-left:auto;font-family:Georgia,serif;font-size:19px;color:var(--gold2)}
.tcard .verd{margin-top:8px;font-size:13px;color:#cbbf9f;font-style:italic;border-top:1px dashed #3a2c1855;padding-top:7px}
.distbar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:10px 0;font-size:11.5px}
.distbar div{display:flex;align-items:center;justify-content:center;color:#120c06;font-weight:700}

/* ростер */
.member{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:linear-gradient(var(--panel2),var(--panel))}
.member .mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.member .mname{font-size:17px;color:var(--gold2);font-family:Georgia,serif;font-weight:700}
.member select{max-width:140px}
.build{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:7px 10px;background:#00000038;border-radius:8px;margin-top:6px;font-size:13.5px}
.build b{color:var(--gold2)}
.pill{padding:2px 9px;border-radius:6px;background:#ffffff10;font-size:12px}
.pill.set{border:1px solid #4e9dd488;color:#9fd0f0}
.pill.wp{border:1px solid #a86fe088;color:#d9b8ff}
.pill.imp{border:1px solid #d4a94e88;color:#f4d488}
.herosel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.herosel .pill{border:1px solid var(--line);color:var(--text);cursor:pointer}
.herosel .pill:hover{border-color:var(--gold)}
.acwrap{position:relative}
.acwrap .ac{position:absolute;top:100%;left:0;right:0;background:var(--panel2);border:1px solid var(--gold);border-radius:8px;z-index:20;max-height:220px;overflow-y:auto;box-shadow:0 10px 30px #000c}
.ac .item{padding:6px 10px;cursor:pointer;font-size:13.5px}
.ac .item:hover{background:#c8963e22}

/* события */
.ev{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#00000030;flex-wrap:wrap}
.ev .dt{min-width:170px;color:var(--gold2);font-weight:600}
.ev .tt{font-family:Georgia,serif}
.ev .who{margin-left:auto;color:var(--dim);font-size:13px}

/* главная */
.hero-banner{border:1px solid var(--line);border-radius:14px;padding:30px 26px;margin-bottom:16px;
 background:linear-gradient(160deg,#241a0e,#150f08 70%),radial-gradient(600px 200px at 80% 0%,#c8963e18,transparent)}
.hero-banner h1{font-size:30px;color:var(--gold2)}
.hero-banner p{color:var(--dim);margin-top:6px;max-width:640px}
.homecols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.homecols{grid-template-columns:1fr}.hrow{flex-wrap:wrap}}
.top5{display:flex;gap:10px;flex-wrap:wrap}
.top5 .chip{cursor:pointer;background:#00000040;border:1px solid var(--line);border-radius:10px;padding:9px 13px}
.top5 .chip:hover{border-color:var(--gold)}
.chip .n{color:var(--gold2);font-family:Georgia,serif}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2113;border:1px solid var(--gold);
 color:var(--gold2);padding:9px 20px;border-radius:10px;z-index:200;box-shadow:0 8px 30px #000c;display:none}

/* --- под-разделы (боссы/снаряжение/герои) --- */
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.subtabs button{background:#1c1c2a;border:1px solid #33334d;color:#cfcfe8;padding:7px 14px;border-radius:18px;cursor:pointer;font-size:14px}
.subtabs button.on{background:#3d3d6b;border-color:#5c5c9e;color:#fff}
.subpane{margin-top:6px}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0}
.comp select{background:#14141f;border:1px solid #33334d;color:#eee;border-radius:8px;padding:7px;max-width:220px}
.compline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pillchip{display:inline-flex;align-items:center;gap:4px}
.pillchip .x{background:transparent;border:none;color:#f66;cursor:pointer;font-size:14px;padding:0 2px}
.tagline{color:#9a9ac4;font-style:italic;margin:4px 0 10px}
.boss ul{margin:6px 0 12px 20px;line-height:1.55}
.boss h4{margin:14px 0 6px;color:#e8d49a}
.notesbox textarea{width:100%;min-height:90px;background:#14141f;border:1px solid #33334d;color:#eee;border-radius:8px;padding:10px;font-family:inherit;box-sizing:border-box}
.small{font-size:13px}

.hcard .pimg{margin:0 0 10px;border-radius:8px;overflow:hidden;border:1px solid #ffffff26;box-shadow:0 2px 10px #0006}
.pimg svg{display:block;width:100%;height:auto}
.hcard:hover .pimg svg{filter:brightness(1.1)}
.pimg{position:relative}.pimg .pstack{position:relative}.pimg img.pphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:2}

@media(max-width:640px){
 #hgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .hcard{padding:10px}
 .hcard h4{font-size:14.5px}
 .comps{grid-template-columns:1fr}
 .compline{flex-direction:column;align-items:stretch}
 .compline select,.compline .btn{width:100%;height:44px;font-size:15px}
 .panel{padding:12px}
 .overlay .hpage{width:100%;max-width:100%;border-radius:0}
}

/* ---- рандомайзер ---- */
.rsub{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.rsub .btn.on{outline:2px solid #f5c04a;outline-offset:-2px}
.rcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:var(--panel)}
.rmech{margin:6px 0 10px;padding-left:18px}
.rmech li{margin:4px 0}
.rok,.robad{border-radius:10px;padding:10px 12px;margin:8px 0}
.rok{border-left:3px solid #58c470;background:rgba(88,196,112,.08)}
.robad{border-left:3px solid #e05a5a;background:rgba(224,90,90,.08)}
.rok ul,.robad ul{margin:6px 0 0;padding-left:18px}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:10px 0}
.rhero{display:flex;gap:10px;align-items:flex-start;border:1px solid #2a3444;border-radius:10px;padding:8px}
.rhero .pstack{flex:0 0 56px}
.rhero .pstack img{width:56px;height:64px;object-fit:cover;border-radius:8px}
.rhero b{display:block}
.rfoot{margin-top:8px;color:#9aa8b4}
@media(max-width:640px){.rlist{grid-template-columns:1fr}.rsub .btn{flex:1 1 auto}}
.rcard2{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.rhead{font-weight:700;color:var(--gold2);margin-bottom:10px;letter-spacing:.3px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rhero{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg2);position:relative}
.rhero.rleg{border-color:var(--leg)}.rhero.repi{border-color:var(--epic)}.rhero.rrare{border-color:var(--rare)}
.rtop{position:relative;flex:0 0 auto}
.rslot{position:absolute;top:-6px;left:-6px;z-index:2;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#120c06;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg2)}
.rinf{min-width:0}
.rinf b{color:var(--gold2)}
.rrole{display:inline-block;margin:2px 0 4px;padding:1px 8px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.rtk{background:rgba(212,169,78,.18);color:var(--gold2);border:1px solid var(--leg)}
.rhl{background:rgba(88,196,112,.14);color:#7fd492;border:1px solid #3f7d4d}
.rsh{background:rgba(168,111,224,.14);color:#c9a5ef;border:1px solid #6d4b93}
.rfo{background:rgba(79,157,212,.14);color:#9fd0f0;border:1px solid #3f6e94}
.rdp{background:rgba(224,75,47,.14);color:#f0a58c;border:1px solid #94402a}
.rstat{display:block;font-size:11px;color:var(--dim)}
.rinf p{margin:6px 0 0;font-size:12.5px;line-height:1.45;color:var(--text)}
.rplan{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.rplan b{color:var(--gold2)}
.rbtns{margin-top:10px}
@media(max-width:640px){.rgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hrow">
    <svg class="crest" viewBox="0 0 64 64" aria-hidden="true">
<defs>
<linearGradient id="shg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2f1c"/><stop offset=".55" stop-color="#241a10"/><stop offset="1" stop-color="#120c06"/></linearGradient>
<linearGradient id="blg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4d488"/><stop offset=".5" stop-color="#c8963e"/><stop offset="1" stop-color="#8a5a1e"/></linearGradient>
<linearGradient id="blg2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d488"/><stop offset=".5" stop-color="#c8963e"/><stop offset="1" stop-color="#8a5a1e"/></linearGradient>
</defs>
<path d="M32 3 55 11v21c0 16-14 26-23 29C23 58 9 48 9 32V11Z" fill="url(#shg)" stroke="#c8963e" stroke-width="2.5"/>
<path d="M32 8 50 14.5v17.5C50 44.5 39 52.5 32 55.5 25 52.5 14 44.5 14 32V14.5Z" fill="none" stroke="#6b4c1d" stroke-width="1.4"/>
<g stroke-linecap="round"><path d="M20 20 44 44" stroke="url(#blg)" stroke-width="4.6"/><path d="M44 20 20 44" stroke="url(#blg2)" stroke-width="4.6"/></g>

ри атаке врага под [Отключением] с вероятностью 25% снимает с цели 1 случайный [Бафф].", "note": ""}]}, "tier": [{"pdf_name": "Anu", "en": "Anu", "hero": "Anu", "score": "50", "tier": "S", "verdict": "С полной ответственностью могу посоветовать остановиться на этом герое, если он вам выпадет. Вы не пожалеете."}, {"pdf_name": "Anubis", "en": "Anubis", "hero": "Anubis", "score": "39", "tier": "A", "verdict": "Ребаланс героя производит странное впечатление. Ему убили базовый навык, зато апнули основной, и дали хорошую быструю ульту. Ну, а пассивка поможет дать жару в тяжелый момент. Anubis по прежнему не совсем подходит для выбора в мини-игре. Зато он стал понятнее, конкретнее и стабильнее в своём игровом стиле. Если вам нужны массовые разлом и большой штраф атаки с частотой основного навыка, то это хороший вариант."}, {"pdf_name": "Apollo", "en": "Apollo", "hero": "Apollo", "score": "29", "tier": "C", "verdict": "Но герой сильнее своего рейтинга, это точно. И вот, что точно еще. Это не тот случай, когда поставил состав на авто и сидишь, куришь. Это сложный герой. И сложности начнутся еще до начала боя. Если вы криво оденете его, если состав не будет ему подходить, то выйдет лажа. Просто хочется расставить все точки над \"и\". Я не советую вам выбирать этого героя на старте, если вы не собираетесь донатить. Без сильных напарников Apollo не вывезет вас, он вас закопает. Этот герой слаб на старте вашего аккаунта, но будет становится все лучше со временем. И это время ему нужно дать."}, {"pdf_name": "Ares", "en": "Ares", "hero": "Ares", "score": "42", "tier": "A", "verdict": "Хорошая оценка для героя, которого хейтят все без разбора. На поверку Ares не только нагибает арену, но и способен помочь вам буквально в любых локациях. Да, его усилили уже после первого нашего выбора, но теперь то никто не мешает оценить его силу."}, {"pdf_name": "Artemis", "en": "Artemis", "hero": "Artemis", "score": "18", "tier": "D", "verdict": "Перед нами дно легендарного рейтинга убийц. Artemis и так звёзд с неба не хватала, но последний ребаланс окончательно убил все перспективы этого героя. Шотнуть врагов на арене - единственная доступная для неё роль. И на этом всё."}, {"pdf_name": "Athena", "en": "Athena", "hero": "Athena", "score": "34", "tier": "B", "verdict": "Ура ребалансу! Механика базы у героини по скорости противоречит механике основы. Окаменение то требует точности, то нет. Ульта бесполезна против боссов и при этом стоит как самолёт. Нравится? Берите. )))"}, {"pdf_name": "Cizin", "en": "Cizin", "hero": "Cizin", "score": "53.5", "tier": "S+", "verdict": "Это самый самый верх. Превосходный результат для дд! Ребаланс усилил героя, хотя он и без него был в топе. Отличный выбор на старте и в самой игре. Вообще без вопросов. Точнее один всё таки есть... Точнее одна... )))"}, {"pdf_name": "Dracula", "en": "Dracula", "hero": "Dracula", "score": "34", "tier": "B", "verdict": "Ребаланс возродил этого героя из пепла! Теперь, это не просто дотер, а ещё и нагибатель арены. Кто бы мог подумать... И лишь максимально дурная ульта портит весь коленкор. Но не смотрите на оценку героя. Он сильнее её, так как все главные моменты: арена, боссы подземелий, волны и клановый босс в его наборе навыков учтены."}, {"pdf_name": "Freya", "en": "Freya", "hero": "Freya", "score": "38.5", "tier": "A", "verdict": "Правда самый его низ. Вас радует такая оценка? Меня не очень."}, {"pdf_name": "Fujin", "en": "Fujin", "hero": "Fujin", "score": "37.5", "tier": "A", "verdict": "Причем из-за дикой рандомности его ульты этот герой может легко упасть тиром ниже. Это один из самых странных, несбалансированных героев в игре. Конечно, я не рекомендую брать этого персонажа в квесте. Но вот потом его пассивка может вам пригодится."}, {"pdf_name": "Grendel", "en": "Grendel", "hero": "Grendel", "score": "31", "tier": "C", "verdict": "В итоге Grendel остался там, где и был до ребаланса. На дне рейтинга. К чему были все эти телодвижения?"}, {"pdf_name": "Heimdall", "en": "Heimdall", "hero": "Heimdall", "score": "45", "tier": "S", "verdict": "Даже не первое место в рейтинге танков. Неожиданно. Но факт есть факт. И даже пробуды не исправят положения. Хеймдаль усилит с ними те навыки, которые и так сильны. Но все же, не смотря на мою критику, асгардский танк, это сильный герой. Если вы сможете четко расставить приоритеты и правильно собрать пачку, то он вас не разочарует."}, {"pdf_name": "Hel", "en": "Hel", "hero": "Hel", "score": "54.5", "tier": "S+", "verdict": "Брать ли этого героя в мини игре? Да! Hel - отличный дд, универсальный и вечный, что уникально для мини-игры. А ещё, Hel - лучший герой для арены, и для кого-то это станет решающим плюсом."}, {"pdf_name": "Hercules", "en": "Hercules", "hero": "Hercules", "score": "30.5", "tier": "C", "verdict": "Самый его низ. Разработчики молодцы. Геракл и так был слабым, непривлекательным героем, но они сумели сделать его ещё хуже. Топчики!"}, {"pdf_name": "Isis", "en": "Isis", "hero": "Isis", "score": "47", "tier": "S", "verdict": "И, это отличная оценка со всеми нюансами."}, {"pdf_name": "Izanagi", "en": "Izanagi", "hero": "Izanagi", "score": "43.5", "tier": "S", "verdict": "Отличный результат. Вокруг этого героя было много хайпа. Какой он расчудесный. Но раньше он таким совершенно не казался при внимательном рассмотрении. Последние изменения сделали героя намного полезнее. Казалось бы, не так много и поменялось, но этого достаточно, чтобы из нишевого героя для “богатых” аккаунтов Izanagi стал универсалом способным помочь вам с самого старта."}, {"pdf_name": "Izanami", "en": "Izanami", "hero": "Izanami", "score": "30", "tier": "C", "verdict": "Сказать, что я разочарован, это очень сильно преуменьшить. Но, хотя бы она обогнала Перуна. ))) Месяц, господа, разработчики прятали от нас это чудо и, наконец, явили его миру. Лучше бы прятали дальше."}, {"pdf_name": "Lamashtu", "en": "Lamashtu", "hero": "Lamashtu", "score": "38.5", "tier": "A", "verdict": "Результат хороший, тем более, что этот герой редко бывает на слуху."}, {"pdf_name": "Loki", "en": "Loki", "hero": "Loki", "score": "40", "tier": "A", "verdict": "Герой совершил грандиозный скачок с самого дна рейтинга в комфортабельную зону хороших персонажей. Конечно, это всё ещё не категория \"дайте два\". Вы не станете выбирать его в мини-игре в качестве стартера, но потом вы точно не будете огорчены, если он вам выпадет. Особенно любители арены. )))"}, {"pdf_name": "Metztli", "en": "Metztli", "hero": "Metztli", "score": "45.5", "tier": "S", "verdict": "Ребаланс здорово помог героине обрести второе дыхание. Ее выбор в мини-игре теперь точно не ошибка. Просто конкуренция среди заклинателей невероятно высока. А вот в самой игре приди она вам, то стоит качать её не задумываясь."}, {"pdf_name": "Morgan Le Fay", "en": "Morgan Le Fay", "hero": "Morgan Le Fay", "score": "63.5", "tier": "S++", "verdict": "Что они там курят?"}, {"pdf_name": "Mulan", "en": "Mulan", "hero": "Mulan", "score": "42.5", "tier": "A", "verdict": "Колоссальный скачок в рейтинге вверх. Теперь этот герой вполне подходит для прокачки даже для развитого аккаунта. Её способность наносить очень много урона пригодится практически всегда."}, {"pdf_name": "Pazuzu", "en": "Pazuzu", "hero": "Pazuzu", "score": "38.5", "tier": "A", "verdict": "Прекрасный пример правильного ребаланса. Вместо дна перед нами, крепкий, добротный дебаффер. Думаю, если он был бы таким с самого старта, то его выбрали бы многие. Сейчас, конечно, он не смотрится кандидатом во 2 бету, но в самой игре его качать точно можно. Особенно тем, у кого не самые богатые аккаунты."}, {"pdf_name": "Perun", "en": "Perun", "hero": "Perun", "score": "24.5", "tier": "D", "verdict": "У Перуна плохой антизалив, а ведь кроме этого, как у дебаффера у него ничего нет. Зато Perun может стать интересным дд, если полностью проигнорировать его штраф. В любом случае героя ждут трудные времена с такими то навыками, и я крайне не рекомендую вкладываться в него ни на старте, ни потом."}, {"pdf_name": "Quetzalcoatl", "en": "Quetzalcoatl", "hero": "Quetzalcoatl", "score": "47", "tier": "S", "verdict": "Даже после дичайшего нерфа герой остался на самом верху! Каким же он был раньше..."}, {"pdf_name": "Raijin", "en": "Raijin", "hero": "Raijin", "score": "31.5", "tier": "B", "verdict": "Это низкая оценка, для героя с которым мы хотим стартовать. Собственно повальное игнорирование его блогерами, несмотря на хвалебные отзывы, именно это и демонстрирует."}, {"pdf_name": "Shamash", "en": "Shamash", "hero": "Shamash", "score": "49", "tier": "S", "verdict": "Прекрасный во всех отношениях герой. Выбор опытного игрока, знающего что к чему."}, {"pdf_name": "Sun Wukong", "en": "Sun Wukong", "hero": "Sun Wukong", "score": "36.5", "tier": "B", "verdict": "И многих это сильно расстроит. Бывший топ 1 рейтинга героев мини-игры превратился в аутсайдера. Такова се ля ви."}, {"pdf_name": "Svarog", "en": "Svarog", "hero": "Svarog", "score": "42.5", "tier": "A", "verdict": "Герой без сомнения отличный. Он пригодится и на старте и в дальнейшем. Единственным явным недостатком является, пожалуй, зависимость от точности."}, {"pdf_name": "Viviane", "en": "Viviane", "hero": "Viviane", "score": "58.5", "tier": "S+", "verdict": "В этот раз блогеры оказались правы. Герой стоит своей славы. И это при том, что у Viviane существует конструктивный изъян. Два ее лучших навыка противоречат друг другу. Очевидно, что вам придется, чем то пожертвовать, и это заметно осложнит ситуацию. Однако, плюсы героя настолько перевешивают минус, что на него можно закрыть глаза."}, {"pdf_name": "Yan Wang", "en": "Yan Wang", "hero": "Yan Wang", "score": "29.5", "tier": "B", "verdict": "Ещё один дисруптор с треском провалил экзамен. Это худший в мини- игре класс героев. Яньло Ван прекрасный образец плохого конструкторского исполнения. У героя отличные штрафы, но они либо имеют низкий шанс наложения, либо накладываются случайным образом, либо имеют слишком малую длительность. Герои Эхо-призыва доступны всем игрокам за ресурсы полученные при призыве ваших героев."}, {"pdf_name": "Hades", "en": "Hades", "hero": "Hades", "score": "33", "tier": "B", "verdict": "И вроде результат не впечатляет, так почему же я не ругаю этого героя, а, наоборот, поддерживаю? Всё достаточно просто. Это герой эхо-призыва, а значит, мы сможем призвать его в любой удобный момент. И, это значительно снижает требования к персонажу. Вдобавок, все его свойства действительно полезны, хотя может и не вызывают большого восторга."}, {"pdf_name": "King Arthur", "en": "King Arthur", "hero": "King Arthur", "score": "35", "tier": "B", "verdict": "Герой не выглядит интересным на данный момент. Из трех вариантов эхо-призыва он самый сомнительный. Зависимость основной механики от наличия героев одной фракции, непонятный штраф веры, одновременные Невидимость и Провокация. Героя будто склеили из противоречий. Стоит обратить на него внимание лишь в случае крайнего невезения с получением в игре нормальных танков. Да, такой вариант возможен, но это будет печально. Честно говоря, разработчикам стоило сделать Артура поинтереснее, как никак, это очень знаменательный персонаж фольклора. Единственный рабочий вариант связанный с Артуром, получить из него отпечаток. Это единственная часть героя, которая в нужных условиях способна поднять силу вашего аккаунта на новый уровень."}, {"pdf_name": "Ra", "en": "Ra", "hero": "Ra", "score": "45.5", "tier": "S", "verdict": "Ситуация ненормальная. Ну не может быть у общедоступного героя такого урона. Как долго это продлится? До 2 беты точно. Потом всё может поменяться. Пользуйтесь друзья, пока оно работает."}], "tiersMeta": {"S++": "#ff3b3b", "S+": "#ff8a3d", "S": "#ffd35b", "A": "#7dd957", "B": "#5bc8e8", "C": "#b48be8", "D": "#8a8a8a"}, "tiersMetaLabel": {"S++": "S++ — имбище", "S+": "S+ — высший класс", "S": "S — топ", "A": "A — сильные", "B": "B — рабочие", "C": "C — проходные", "D": "D — слабые"}, "roles": ["Лидер", "Офицер", "Боец", "Рекрут"], "slogan": "Гон собирается на рассвете"};

    }
  });

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.style.display='block';
  clearTimeout(toastT); toastT = setTimeout(()=>t.style.display='none', 2600);
}
function tierBadge(tier, big){
  if(!tier) return '';
  const c = D.tiersMeta[tier] || '#8a8a8a';
  return `<span class="tierbadge" style="color:${c};border:1.5px solid ${c}88;background:${c}14;${big?'font-size:15px;padding:4px 13px;':''}">${tier}</span>`;
}
function rankOf(name){
  const r = (HERO[name]||{}).rarity;
  return r==='Легендарный'?'leg':(r==='Эпический'?'epic':(r==='Редкий'?'rare':''));
}
function heroChip(name){
  const t = TIER[name] ? tierBadge(TIER[name].tier) : '';
  return `<span class="pill" data-hero="${esc(name)}" style="cursor:pointer" onclick="openHero(this.dataset.hero)">${esc(name)} ${t}</span>`;
}

function rShield(h){return /[Щщ]ит/.test(String(h.abilities||''))}
function rAoe(h){return /всех враг|все враг|площад/i.test(String(h.abilities||''))}
function rDebuff(h){return /Заморозка|Кровотечени|Яд|Штраф|Ослаб|Проклят|Оглушени|Сон|Молчание|Немота|Слабост/i.test(String(h.abilities||''))}
/* ---------- механический движок подбора ---------- */
function rKw(A){A=String(A||'');const m=A.match(/(\d+)\s*раза/);return{
 freeze:/Заморозка/i.test(A),
 hits:m?+m[1]:1,
 aoe:/всех врагов|все враги|все цели|атака всех/i.test(A),
 heal:/лечение[^.;]{0,60}союзник|исцеляет[^.;]{0,40}союзник|восстанавливает[^.;]{0,40}союзник|регенерация[^.;]{0,40}союзник/i.test(A),
 shield:/\[Щит\]/i.test(A),
 cleanse:/снимает[^.;]{0,40}дебафф|очищает[^.;]{0,30}дебафф|снимает все эффекты/i.test(A),
 buff:/\[Повышение/i.test(A),
 debuff:/\[(?:[^\[\]]*Down|Заморозка|Блок ультимейта|Снижение|Отравлен|Сжиган|Шок|Провокация|Кровотечен|Яд|Ослаблен|Штраф|Проклят|Оглушен|Сон|Молчание|Немота)/i.test(A),
 divinity:/божественност/i.test(A),
 cd:/\u2212\d+ КД|снижает КД|шкалы хода|шкалу хода/i.test(A),
 interrupt:/Блок ультимейта|прерыва/i.test(A)}}
function rMech(h,mode,bid){
 const k=rKw(h.abilities);let s=0,why=[];
 if(mode==='Боссы'){
  if(bid==='fafnir'){
   if(k.freeze){s+=120;why.push('[Заморозка] срезает 50% чешуи — экономит целый раунд')}
   if(k.hits>1){s+=40*k.hits;why.push(k.hits+' удара базовой — осыпают '+k.hits+' стака чешуи за ход')}
   if(k.interrupt){s+=60;why.push('не даёт ульте восстановить боссу 30% ОЗ')}
  }else if(bid==='goldguard'){
   if(k.divinity){s+=150;why.push('работает с божественностью — удерживает её ниже порога казни')}
   if(k.hits>1){s-=200;why.push('мультиудар кормит божественность (+10 за удар) — сюда не подходит')}
  }else if(bid==='daimyo'){
   if(k.cd){s+=90;why.push('разгоняет шкалу хода и снижает КД — удешевляет ульты')}
   if(k.interrupt){s+=30;why.push('контролирует касты босса')}
  }else if(bid==='luktor'){
   if(k.buff){s+=60;why.push('бафы на пачку — усиление боссу безразлично')}
   if(k.shield){s+=50;why.push('щиты держат пачку между кастами босса')}
   if(!k.debuff)s+=10;
  }else if(bid==='gurah'){
   if(k.aoe){s+=100;why.push('AoE гасит тотемы поджига — открывает окно уязвимости')}
   if(k.freeze){s+=20;why.push('контроль помогает пережить цикл возгорания')}
  }else if(bid==='ahpuch'){
   if(k.cleanse){s+=140;why.push('чистит дебаффы с пачки — надёжный ответ непроверенному киту')}
   if(k.buff){s+=40;why.push('бафы на пачку')}
  }
 }
 if(mode==='Башни'&&k.aoe){s+=80;why.push('AoE чистит волны без потери темпа')}
 if(mode==='Клан босс'){if(k.buff){s+=30;why.push('бафы разгоняют ровный урон под кап 25%')}if(k.aoe)s-=15}
 if(mode==='Арена'&&k.freeze){s+=30;why.push('заморозка выбивает врага из первого хода')}
 return{s:s,why:why}
}
function rHealReal(h){return rKw(h.abilities).heal}
function rRank(h,f,pred){const arr=D.data.heroes.filter(pred).sort((a,b)=>rnum(b[f])-rnum(a[f]));const p=arr.indexOf(h)+1;return p>0?(p===1?'1-й':p+'-й'):''}
function rHealTxt(h){const m=String(h.abilities||'').match(/(лечение[^.;]{0,50})/i);return m?m[1].trim():'лечение в ките'}
function buildSquad(mode,bid){
  const hs=D.data.heroes;let base=hs.slice();const ban=[],force=[];
  if(mode==='Боссы'&&bid==='goldguard'){force.push('Anubis','Hound of Duat','Set','Beowulf');ban.push('Skadi')}
  if(mode==='Боссы'&&bid==='luktor')base=base.filter(h=>!rKw(h.abilities).debuff);
  if(mode==='Боссы'&&bid==='goldguard')base=base.filter(h=>force.indexOf(h.name)>=0||(!rKw(h.abilities).freeze&&rKw(h.abilities).hits<2));
  const pool=base.filter(h=>ban.indexOf(h.name)<0);
  const picks=[];const take=h=>{if(!h)return;const i=pool.indexOf(h);if(i<0)return;pool.splice(i,1);picks.push(h)};
  force.forEach(n=>take(pool.find(h=>h.name===n)));
  if(mode!=='Арена'&&!picks.some(h=>h.archetype==='Защитник')){const t=pool.filter(h=>h.archetype==='Защитник').sort((a,b)=>rnum(b.def)-rnum(a.def))[0];take(t)}
  if(mode!=='Арена'&&!picks.some(rHealReal)){const l=pool.filter(rHealReal).sort((a,b)=>rnum(b.fth)-rnum(a.fth))[0];take(l)}
  if(mode==='Подземелье'&&!picks.some(h=>rKw(h.abilities).shield)){const sh=pool.filter(h=>rKw(h.abilities).shield).sort((a,b)=>rnum(b.def)-rnum(a.def))[0];take(sh)}
  if(mode==='Башни'){const aoe=pool.filter(h=>rKw(h.abilities).aoe).sort((a,b)=>rnum(b.atk)-rnum(a.atk)).slice(0,2);aoe.forEach(take)}
  pool.sort(function(a,b){
    const ma=rMech(a,mode,bid),mb=rMech(b,mode,bid);
    if(mb.s!==ma.s)return mb.s-ma.s;
    if(mode==='Арена')return rnum(b.spd)-rnum(a.spd);
    return rnum(b.atk)-rnum(a.atk)||rnum(b.spd)-rnum(a.spd);
  });
  const cap=mode==='Подземелье'?4:5;
  while(picks.length<cap&&pool.length)picks.push(pool.shift());
  return picks.slice(0,cap)
}
function rWhy(h,mode,bid){
 const k=rKw(h.abilities);
 if(mode==='Боссы'){
  if(bid==='goldguard'&&k.hits<2&&!k.divinity)return 'редкий тяжёлый удар — не кормит божественность, а казнь бьёт только после её ульты';
  const m=rMech(h,mode,bid);
  if(m.why.length)return m.why.join('; ');
  if(bid==='fafnir')return 'АТК '+h.atk+' — весь урон держим в окно слабости (+50% урона)';
  if(bid==='daimyo')return 'АТК '+h.atk+' — тяжёлые одиночные удары по барьеру, без спешки';
  if(bid==='luktor')return 'без дебаффов в ките — босс не получает усиления от пачки';
  if(bid==='gurah')return 'АТК '+h.atk+' — урон в короткое окно после тотемов';
  if(bid==='ahpuch')return 'АТК '+h.atk+' — надёжный урон по боссу с непроверенным китом';
  return 'АТК '+h.atk+' — урон по боссу';
 }
 if(h.archetype==='Защитник'){const r=rRank(h,'def',x=>x.archetype==='Защитник');return 'танк · ЗАЩ '+h.def+' — '+r+' по защите среди Защитников — держит удары босса на себе'}
 if(rHealReal(h))return 'лекарь · '+rHealTxt(h)+' — держит ОЗ пачки весь бой';
 if(k.shield){const r=rRank(h,'def',x=>rKw(x.abilities).shield);return 'щитовик · ЗАЩ '+h.def+' ('+r+' среди щитовиков) — поглощает урон до того, как он дойдёт до ОЗ'}
 if(mode==='Арена')return 'SPD '+h.spd+' — первые ходы и диктовка темпа';
 if(mode==='Клан босс'){const r=rRank(h,'atk',()=>true);return 'АТК '+h.atk+' ('+r+' в базе) — ровный урон, ничего не сгорает в кап 25%'}
 if(mode==='Башни'&&k.aoe)return 'АТК '+h.atk+' — AoE под волны';
 if(mode==='Башни')return 'АТК '+h.atk+' — нюкер по боссу этажа';
 const r=rRank(h,'atk',()=>true);return 'АТК '+h.atk+' ('+r+' в базе) — урон по каркасу';
}
function rFooter(mode,bid){
 if(mode==='Боссы'){
  const m={fafnir:'Связка боя: заморозка осыпает чешую, мультиудары снимают стаки, бёрст бьёт в окно слабости (+50% урона), контроль не даёт ульте лечить босса.',
  goldguard:'Сначала срез божественности, затем Beowulf добивает в окно казни. Мультиудары и Skadi исключены — они кормят босса.',
  daimyo:'Планомерный бой: порядок миньонов и удешевление ульт важнее сырой силы — ходы считайте на 2-3 вперёд.',
  luktor:'В пачке нет дебафферов: босс не получает усиления, а бафы на себя работают как обычно.',
  gurah:'Дисциплина тотемов: гасим в правильном порядке, ульты копим под короткое окно уязвимости.',
  ahpuch:'Кит босса не подтверждён — универсальный каркас: лекарь, чистка дебаффов, бафы на пачку.'};
  return m[bid]||'';
 }
 if(mode==='Подземелье')return 'Каркас выживания: танк держит удары, лекарь и щитовик гасят просадки, бьющий добивает. В подземелье команда до 4 героев.';
 if(mode==='Клан босс')return 'Танк держит удар, лекарь поддерживает, урон ровный (кап 25%). Сродство меняется ежедневно — пересоберите пачку под сегодняшнее.';
 if(mode==='Башни')return 'AoE-герои чистят волны, нюкер снимает босса этажа.';
 if(mode==='Арена')return 'Пачка отсортирована по SPD: быстрые ходят первыми, заморозка выбивает врага из темпа.';
 return ''
}
function rRole(h,R){
 if(R.mode==='Боссы'&&R.bid==='goldguard'&&R.picks.indexOf(h)<4)return 'срез';
 if(h.archetype==='Защитник')return 'танк';
 if(rHealReal(h))return 'лекарь';
 if(rKw(h.abilities).shield)return 'щитовик';
 return 'урон';
}

function rCard(t,body){return '<div class="rcard"><h3>'+t+'</h3>'+body+'</div>'}
function rSquadHTML(R){
  const b=R.bid?BOSSES.find(x=>x.id===R.bid):null;
  const cls={'срез':'rfo','танк':'rtk','лекарь':'rhl','щитовик':'rsh','урон':'rdp'};
  let body='<div class="rgrid">'+R.picks.map(function(h,i){
    const role=rRole(h,R);
    const rr=h.rarity==='Легендарный'?' rleg':h.rarity==='Эпический'?' repi':' rrare';
    return '<div class="rhero'+rr+'"><div class="rtop"><span class="rslot">'+(i+1)+'</span>'+portraitHTML(h)+'</div><div class="rinf"><b>'+esc(h.name)+'</b><span class="rrole '+cls[role]+'">'+role+'</span><span class="rstat">АТК '+h.atk+' · ЗАЩ '+h.def+' · СПД '+h.spd+'</span><p>'+esc(rWhy(h,R.mode,R.bid))+'</p></div></div>';
  }).join('')+'</div>';
  const f=rFooter(R.mode,R.bid);
  if(f)body+='<div class="rplan"><b>План боя</b><p class="small">'+esc(f)+'</p></div>';
  body+='<div class="rbtns"><button class="btn" onclick="rBuild(\''+(R.bid||'')+'\')">🎲 Другой вариант</button></div>';
  return '<div class="rcard2"><div class="rhead">🎲 Пачка — '+R.mode+(b?' · '+esc(b.name):'')+'</div>'+body+'</div>';
}

  if(!root.dataset.built){
    root.innerHTML='<div class="rsub" id="rsubs"></div><div id="rbody"></div>';

function rRenderSubs(){
  document.getElementById('rsubs').innerHTML=RMODES.map(function(m){
    return '<button class="btn mini'+(m===RMode?' on':'')+'" data-m="'+m+'" onclick="rSetMode(this.dataset.m)">'+m+'</button>';
  }).join('');
}
function rSetMode(m){RMode=m;if(m!=='Боссы')RBoss='';RRes=null;rRenderSubs();rRender()}
function rSelBoss(v){RBoss=v;RRes=null;rRender()}
function rBuild(bid){RRes={mode:RMode,bid:bid||'',picks:buildSquad(RMode,bid||'')};rRender()}
function rRender(){
  const root=document.getElementById('rbody'); if(!root)return;
  let html='';
  if(RMode==='Боссы'){
    html+='<div class="rcard"><h3>Боссы</h3><p class="small muted">'+RINFO['Боссы']+'</p>';
    html+='<select id="rboss" onchange="rSelBoss(this.value)"><option value="">— выберите босса —</option>'+BOSSES.map(function(b){return '<option value="'+b.id+'"'+(b.id===RBoss?' selected':'')+'>'+esc(b.name)+'</option>'}).join('')+'</select></div>';
    const b=BOSSES.find(x=>x.id===RBoss);
    if(b){
      const w=RWOK[b.id]||{ok:[],bad:[]};
      html+='<div class="rcard"><h3>'+b.emoji+' '+esc(b.name)+'</h3><p class="small muted">'+esc(b.tagline)+'</p><p>'+esc(b.core)+'</p>';
      html+='<ul class="rmech">'+b.mech.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
      html+='<div class="rok"><b>✅ Что работает</b><ul>'+w.ok.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
      html+='<div class="robad"><b>⛔ Что вредит</b><ul>'+w.bad.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
      html+='<button class="btn" onclick="rBuild(\''+b.id+'\')">🎲 Собрать пачку под '+esc(b.name)+'</button></div>';
      if(RRes&&RRes.bid===b.id)html+=rSquadHTML(RRes);
    } else if(RRes&&RRes.mode==='Боссы')html+=rSquadHTML(RRes);
  } else {
    const map={'Подземелье':'🌿','Клан босс':'⏳','Башни':'🗼','Арена':'⚔️'};
    if(RMode==='Клан босс'){
      html+='<div class="rcard"><h3>'+CLANBOSS.emoji+' '+esc(CLANBOSS.name)+'</h3><p class="small muted">'+esc(CLANBOSS.tagline)+'</p><p>'+esc(CLANBOSS.core)+'</p><ul class="rmech">'+CLANBOSS.mech.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
    } else html+=rCard(RMode+' '+map[RMode],'<p class="small muted">'+RINFO[RMode]+'</p>');
    html+='<div class="rcard"><button class="btn" onclick="rBuild(\'\')">🎲 Собрать пачку</button></div>';
    if(RRes&&RRes.mode===RMode)html+=rSquadHTML(RRes);
  }
  root.innerHTML=html;
}

function migrateRu(){try{const map={};D.data.heroes.forEach(h=>{if(h.ru)map[h.ru]=h.name});for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.indexOf('wh_')!==0)continue;let v=localStorage.getItem(k),o=v;Object.keys(map).forEach(ru=>{v=v.split('"'+ru+'"').join('"'+map[ru]+'"')});if(v!==o)localStorage.setItem(k,v)}}catch(e){}}

function showTab(name){
  curTab = name;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t===name));
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id==='tab-'+name));
  window.scrollTo({top:0});
  if(name==='Состав') renderRoster();
  if(name==='События') renderEvents();
  if(name==='Герои'){ renderHeroGrid(); renderTier(); buildHeroSubs(); }
  if(name==='Боссы') renderBosses();
  if(name==='Клан БОСС') renderClanBoss();
  if(name==='Снаряжение') buildGear();
  if(name==='🎲 Рандомайзер') renderRand();
  if(name==='Главная') renderHome();
  location.hash = encodeURIComponent(name);
}
function initNav(){
  $('#nav').innerHTML = NAV.map(n=>`<button data-t="${n}" onclick="showTab('${n}')">${n}</button>`).join('');
  const h = decodeURIComponent((location.hash||'').slice(1));
  showTab(NAV.includes(h)? h : 'Главная');
}

function hslugs(n){var alts=SLUG_ALTS[n]||[];return alts.concat([HIMG_OVR[n]||pslug(n)]).filter(Boolean)}
function hslug(n){return HIMG_OVR[n]||pslug(n)}
function portraitHTML(h){
  var s=hslug(h.name);
  if(!s) return portraitSVG(h);
  var exts=['png','jpg','jpeg','webp'];
  var cands=[];
  hslugs(h.name).forEach(function(sp){exts.forEach(function(e){cands.push('images/'+sp+'.'+e)})});
  var first=cands.shift()||'';
  var alt=(h.name||'').replace(/"/g,'&quot;');
  return '<div class="pstack">'+portraitSVG(h)
    +'<img class="pphoto" loading="lazy" alt="'+alt+'" src="'+first+'" data-cands="'+cands.join('|')+'" onerror="imgFallback(this)">'
    +'</div>';
}
function imgFallback(el){
  var c=(el.getAttribute('data-cands')||'').split('|').filter(Boolean);
  if(c.length){el.setAttribute('data-cands',c.slice(1).join('|'));el.src=c[0];}
  else el.style.display='none';
}
function portraitSVG(h){
  const p = PPAL[h.pantheon]||['#cfd8e0','#3a4a5a','#0e161e'];
  const [L,M,Dk] = p;
  const ring = RRING[h.rarity]||'#9aa8b4';
  const r = prng(hstr(h.name));
  const id = pslug(h.name)||'h';
  const W=300,H=340,cx=150,cy=150;
  const motif = ['rays','rings','peaks','petals','cog','crescent'][Math.floor(r()*6)];
  let art = '';
  if(motif==='rays'){
    const n = 9+Math.floor(r()*7);
    for(let i=0;i<n;i++){
      const a0 = (Math.PI*2*i)/n + r()*0.2, w = 0.10+r()*0.10;
      const x1=cx+Math.cos(a0-w)*40, y1=cy+Math.sin(a0-w)*40;
      const x2=cx+Math.cos(a0)*150,  y2=cy+Math.sin(a0)*150;
      const x3=cx+Math.cos(a0+w)*40, y3=cy+Math.sin(a0+w)*40;
      art += `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} L ${x2.toFixed(1)} ${y2.toFixed(1)} L ${x3.toFixed(1)} ${y3.toFixed(1)} Z" fill="${L}" opacity="0.14"/>`;
    }
  } else if(motif==='rings'){
    const n = 3+Math.floor(r()*3);
    for(let i=0;i<n;i++){
      const rr = 46+i*(26+r()*14);
      art += `<circle cx="${cx}" cy="${cy}" r="${rr.toFixed(1)}" fill="none" stroke="${i%2?L:M}" stroke-width="${(2+r()*3).toFixed(1)}" opacity="0.22"/>`;
    }
  } else if(motif==='peaks'){
    const n = 3+Math.floor(r()*3);
    for(let i=0;i<n;i++){
      const px = 30+r()*(W-60), pw = 46+r()*70, ph = 90+r()*150;
      art += `<path d="M ${(px-pw).toFixed(1)} ${H} L ${px.toFixed(1)} ${(H-ph).toFixed(1)} L ${(px+pw).toFixed(1)} ${H} Z" fill="${i%2?M:L}" opacity="0.20"/>`;
    }
  } else if(motif==='petals'){
    const n = 5+Math.floor(r()*4);
    for(let i=0;i<n;i++){
      const a0 = (Math.PI*2*i)/n + r()*0.3;
      art += `<ellipse cx="${cx}" cy="${cy-72}" rx="${(14+r()*12).toFixed(1)}" ry="${(40+r()*24).toFixed(1)}" fill="${i%2?L:M}" opacity="0.24" transform="rotate(${(a0*180/Math.PI).toFixed(1)} ${cx} ${cy})"/>`;
    }
  } else if(motif==='cog'){
    const n = 8+Math.floor(r()*5);
    for(let i=0;i<n;i++){
      const a0 = (Math.PI*2*i)/n;
      art += `<rect x="${cx-9}" y="${cy-118}" width="18" height="${(30+r()*22).toFixed(0)}" fill="${L}" opacity="0.20" transform="rotate(${(a0*180/Math.PI).toFixed(1)} ${cx} ${cy})"/>`;
    }
    art += `<circle cx="${cx}" cy="${cy}" r="86" fill="none" stroke="${L}" stroke-width="10" opacity="0.18"/>`;
  } else {
    art += `<circle cx="${cx+34}" cy="${cy-8}" r="66" fill="${L}" opacity="0.20"/><circle cx="${cx+52}" cy="${cy-2}" r="58" fill="${M}"/>`;
    const st = 3+Math.floor(r()*5);
    for(let i=0;i<st;i++){
      art += `<circle cx="${(20+r()*(W-40)).toFixed(1)}" cy="${(16+r()*120).toFixed(1)}" r="${(1+r()*2.4).toFixed(1)}" fill="${L}" opacity="0.7"/>`;
    }
  }
  const stars = [];
  const ns = 9+Math.floor(r()*10);
  for(let i=0;i<ns;i++){
    stars.push(`<circle cx="${(8+r()*(W-16)).toFixed(1)}" cy="${(8+r()*(H-16)).toFixed(1)}" r="${(0.8+r()*1.8).toFixed(1)}" fill="${L}" opacity="${(0.15+r()*0.5).toFixed(2)}"/>`);
  }
  const hatch = [];
  for(let i=-4;i<16;i++){
    const x = i*34;
    hatch.push(`<line x1="${x}" y1="${H}" x2="${x+150}" y2="0" stroke="${M}" stroke-width="1" opacity="0.18"/>`);
  }
  const ini = heroInitials(h.name);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(h.name)}" style="display:block;width:100%;height:auto">
  <defs>
    <linearGradient id="pg-${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${M}"/><stop offset="1" stop-color="${Dk}"/>
    </linearGradient>
    <radialGradient id="pgg-${id}" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="${L}" stop-opacity="0.30"/><stop offset="1" stop-color="${L}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pgv-${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="${Dk}" stop-opacity="0"/><stop offset="1" stop-color="${Dk}" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#pg-${id})"/>
  ${hatch.join('')}
  <rect width="${W}" height="${H}" fill="url(#pgg-${id})"/>
  ${art}
  ${stars.join('')}
  <rect width="${W}" height="${H}" fill="url(#pgv-${id})"/>
  <circle cx="${cx}" cy="${cy}" r="58" fill="${Dk}" opacity="0.82"/>
  <circle cx="${cx}" cy="${cy}" r="58" fill="none" stroke="${ring}" stroke-width="2.5" opacity="0.95"/>
  <circle cx="${cx}" cy="${cy}" r="64" fill="none" stroke="${L}" stroke-width="1" opacity="0.35"/>
  <text x="${cx}" y="${cy+15}" text-anchor="middle" font-family="Georgia,serif" font-size="44" font-weight="bold" letter-spacing="4" fill="#f4ead2">${ini}</text>
  <rect x="6" y="6" width="${W-12}" height="${H-12}" rx="14" fill="none" stroke="${ring}" stroke-width="3" opacity="0.9"/>
  <rect x="12" y="12" width="${W-24}" height="${H-24}" rx="10" fill="none" stroke="${L}" stroke-width="1" opacity="0.25"/>
</svg>`;
}

          ${['Легендарный','Эпический','Редкий'].map(r=>`<option${HF.rarity===r?' selected':''}>${r}</option>`).join('')}</select>
        <select onchange="HF.pantheon=this.value;renderHeroGrid(true)"><option value="">Пантеон: все</option>
          ${uniq('pantheon').map(p=>`<option${HF.pantheon===p?' selected':''}>${p}</option>`).join('')}</select>
        <select onchange="HF.archetype=this.value;renderHeroGrid(true)"><option value="">Архетип: все</option>
          ${uniq('archetype').map(p=>`<option${HF.archetype===p?' selected':''}>${p}</option>`).join('')}</select>
        <select onchange="HF.affinity=this.value;renderHeroGrid(true)"><option value="">Сродство: все</option>
          ${uniq('affinity').map(p=>`<option${HF.affinity===p?' selected':''}>${p}</option>`).join('')}</select>
        <select onchange="HF.sort=this.value;renderHeroGrid(true)">
          <option value="name"${HF.sort==='name'?' selected':''}>Сортировка: имя</option>
          <option value="atk"${HF.sort==='atk'?' selected':''}>АТК ↓</option>
          <option value="hp"${HF.sort==='hp'?' selected':''}>ОЗ ↓</option>
          <option value="spd"${HF.sort==='spd'?' selected':''}>СКР ↓</option>
          <option value="tier"${HF.sort==='tier'?' selected':''}>Тир-рейтинг ↓</option>
        </select>
      </div>
      <div class="grid" id="hgrid"></div>
      <p class="muted" id="hcount" style="margin-top:10px"></p>
    </div>`;
    el.dataset.built = '1';
  }
  const q = HF.q.toLowerCase();
  let list = D.data.heroes.filter(h=>{
    if(HF.rarity && h.rarity!==HF.rarity) return false;
    if(HF.pantheon && h.pantheon!==HF.pantheon) return false;
    if(HF.archetype && h.archetype!==HF.archetype) return false;
    if(HF.affinity && h.affinity!==HF.affinity) return false;
    if(q){
      const blob = (h.name+' '+h.title+' '+h.abilities).toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });
  const num = x => parseFloat(String(x).replace(/[^\d.]/g,''))||0;
  if(HF.sort==='atk') list.sort((a,b)=>num(b.atk)-num(a.atk));
  else if(HF.sort==='hp') list.sort((a,b)=>num(b.hp)-num(a.hp));
  else if(HF.sort==='spd') list.sort((a,b)=>num(b.spd)-num(a.spd));
  else if(HF.sort==='tier') list.sort((a,b)=>{const ta=TIER[a.name],tb=TIER[b.name];
    const va=ta?parseFloat(ta.score):-1, vb=tb?parseFloat(tb.score):-1; return vb-va;});
  else list.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  $('#hgrid').innerHTML = list.map((h,hi)=>{
    const rcls = h.rarity==='Эпический'?'epic':(h.rarity==='Редкий'?'rare':'');
    const tb = TIER[h.name]? `<span class="tb">${tierBadge(TIER[h.name].tier)}</span>`:'';
    return `<div class="hcard ${rcls}" style="animation-delay:${hi*35}ms" onclick="openHero(${JSON.stringify(h.name).replace(/"/g,'&quot;')})">
      ${tb}
      <div class="pimg">${portraitHTML(h)}</div>
      <h4>${esc(h.name)}</h4>
      <div class="sub">${esc(h.title)} · ${esc(h.pantheon)} · ${esc(h.archetype)}</div>
      <div class="rows">
        <span class="mini">ОЗ ${esc(h.hp)}</span><span class="mini">АТК ${esc(h.atk)}</span>
        <span class="mini">ЗАЩ ${esc(h.def)}</span><span class="mini">СКР ${esc(h.spd)}</span>
        <span class="mini">${esc(h.affinity)}</span>
      </div>
      <div class="rows"><span class="r-${esc(h.rarity)} tag">${esc(h.rarity)}</span></div>
    </div>`;
  }).join('');
  $('#hcount').textContent = `Показано ${list.length} из ${D.data.heroes.length}`;
  if(el.classList.contains('on') && !HF.applied){ HF.applied=true; }
}

  const imps = D.data.imprints.filter(i=>i.hero===name);

  const sk = D.data.skills[name]||[];

      <span class="pill">${esc(h.affinity)}</span><span class="pill">${esc(h.allegiance)}</span>
      ${t? tierBadge(t.tier, true)+` <span class="muted">рейтинг ${t.score} баллов</span>`:''}
    </p>
    ${t? `<div class="ablock" style="border-left-color:${D.tiersMeta[t.tier]||'#888'}"><b class="serif">Вердикт обзора:</b> <i>${esc(t.verdict)}</i></div>`:''}
    </div>
    </div>
    <h3 class="serif" style="color:var(--gold2);margin-top:14px">Характеристики</h3>
    <div class="stgrid">
      ${stat('hp','ОЗ')}${stat('atk','АТК')}${stat('def','ЗАЩ')}${stat('spd','СКР')}${stat('fth','Вера')}
      ${stat('crate','Шанс крита')}${stat('cdmg','К.УРОН')}${stat('res','СОПР')}${stat('acc','ТОЧН')}

    <div class="ablock">${esc(h.abilities)}</div>
    <h3 class="serif" style="color:var(--gold2);margin-top:14px">Пробуждения</h3>
    ${aw.map(a=>`<div class="ablock"><span class="awstep">${esc(a.step)}</span> · ${esc(a.ability)} — ${esc(a.effect)}${a.note?` <span class="muted">(${esc(a.note)})</span>`:''}</div>`).join('')||'<p class="muted">Нет данных</p>'}
    <h3 class="serif" style="color:var(--gold2);margin-top:14px">Улучшения умений</h3>
    <div style="overflow-x:auto"><table><thead><tr><th>Способность</th><th>Тип</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr></thead>
    <tbody>${sk.map(s=>`<tr><td><b>${esc(s.ability)}</b></td><td class="muted">${esc(s.type)}</td>
      <td>${esc(s.lvls[0])}</td><td>${esc(s.lvls[1])}</td><td>${esc(s.lvls[2])}</td><td>${esc(s.lvls[3])}</td><td>${esc(s.lvls[4])}</td><td>${esc(s.lvls[5])}</td></tr>`).join('')||'<tr><td colspan=8 class="muted">Нет данных</td></tr>'}</tbody></table></div>

function closeHero(){ $('#overlay').classList.remove('on'); document.body.style.overflow=''; }
$('#overlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeHero(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeHero(); });

<script>
/* ---------- состав клана ---------- */
let ROSTER = LS.get('roster', null);
if(!ROSTER){
  ROSTER = [
    {id:1, name:'Пример: Воевода', role:'Лидер', note:'Собирает пачку на кланового босса',
      heroes:['Morgan Le Fay','Viviane'],
      builds:[{hero:'Morgan Le Fay', set:'Ворон', wp:'Двузубец', imp:'Sorceress Edict', subs:'АТК% / Шанс кр / К.УРОН'}]},
    {id:2, name:'Пример: Стрелок', role:'Боец', note:'Дебаффер, точность 300+',
      heroes:['Ares'],
      builds:[{hero:'Ares', set:'Волк', wp:'Хопеш', imp:'Неистовый воин', subs:'АТК% / СКР / К.УРОН'}]}
  ];
  LS.set('roster', ROSTER);
}
function saveRoster(){ LS.set('roster', ROSTER); }
function renderRoster(){
  const el = $('#tab-Состав');
  el.innerHTML = `
  <div class="panel">
    <h3>Состав клана</h3>
    <p class="muted">Кто кем играет и в чём одет. Данные хранятся в браузере — чтобы поделиться ростером со всем кланом, выгрузите файл кнопкой «Экспорт» и передайте его офицеру (кнопка «Импорт» загрузит данные в браузер).</p>
    <div class="toolrow" style="margin-top:10px">
      <button class="btn" onclick="addMember()">+ Добавить бойца</button>
      <button class="btn ghost" onclick="exportRoster()">Экспорт</button>
      <button class="btn ghost" onclick="importRoster()">Импорт</button>
    </div>
    <div id="mlist">${ROSTER.map((m,i)=>memberHTML(m,i)).join('')}</div>
  </div>`;
}
function memberHTML(m,i){
  const roleOpts = D.roles.map(r=>`<option${m.role===r?' selected':''}>${r}</option>`).join('');
  return `<div class="member" data-i="${i}">
    <div class="mh">
      <input class="mname-edit" value="${esc(m.name)}" placeholder="Имя бойца" style="font-family:Georgia,serif;font-size:15px;max-width:220px"
        onchange="setM(${i},'name',this.value)">
      <select onchange="setM(${i},'role',this.value)">${roleOpts}</select>
      <span class="muted" style="font-size:12.5px">${(m.heroes||[]).length} героев · ${(m.builds||[]).length} билдов</span>
      <span style="margin-left:auto;display:flex;gap:6px">
        <button class="btn mini ghost" onclick="addHero(${i},this)">+ герой</button>
        <button class="btn mini ghost" onclick="addBuild(${i})">+ билд</button>
        <button class="btn mini danger" onclick="delMember(${i})">✕</button>
      </span>
    </div>
    <input value="${esc(m.note||'')}" placeholder="Заметка: пачки, роли, примечания" style="width:100%;margin-top:8px"
      onchange="setM(${i},'note',this.value)">
    <div class="herosel">${(m.heroes||[]).map((h,j)=>
      `<span class="pill" style="cursor:pointer" title="Клик — убрать" onclick="delHero(${i},${j})">${esc(h)} ✕</span>`).join('')||'<span class="muted" style="font-size:13px">Герои не указаны</span>'}</div>
    ${(m.builds||[]).map((b,j)=>buildHTML(b,i,j)).join('')}
  </div>`;
}
function buildHTML(b,i,j){
  const opts = (list, cur, ph) => `<option value="">${ph}</option>`+list.map(x=>`<option value="${esc(x)}"${cur===x?' selected':''}>${esc(x)}</option>`).join('');
  return `<div class="build">
    <select style="max-width:170px" onchange="setB(${i},${j},'hero',this.value)">${opts(D.data.heroes.map(h=>h.name),b.hero,'Герой')}</select>
    <select style="max-width:150px" onchange="setB(${i},${j},'set',this.value)">${opts(D.data.sets.map(s=>s.name),b.set,'Сет')}</select>
    <select style="max-width:190px" onchange="setB(${i},${j},'wp',this.value)">${opts(D.data.weapons.map(w=>w.name),b.wp,'Оружие')}</select>
    <select style="max-width:210px" onchange="setB(${i},${j},'imp',this.value)">${opts(D.data.imprints.map(x=>x.name),b.imp,'Импринт')}</select>
    <input placeholder="Под-статы" value="${esc(b.subs||'')}" style="min-width:150px;flex:1"
      onchange="setB(${i},${j},'subs',this.value)">
    <button class="btn mini danger" onclick="delBuild(${i},${j})">✕</button>
  </div>`;
}
function setM(i,k,v){ ROSTER[i][k]=v; saveRoster(); if(k==='name') rerenderRosterRow(i); }
function rerenderRosterRow(i){
  const list = $('#mlist'); if(!list) return;
  list.children[i].outerHTML = memberHTML(ROSTER[i], i);
}
function addMember(){
  ROSTER.push({id:Date.now(), name:'Новый боец', role:'Боец', note:'', heroes:[], builds:[]});
  saveRoster(); renderRoster();
}
function delMember(i){
  if(!confirm('Убрать бойца из состава?')) return;
  ROSTER.splice(i,1); saveRoster(); renderRoster();
}
function addHero(i){ openHeroPick(i); }
function openHeroPick(i){
  const cur = ROSTER[i].heroes||[];
  const avail = D.data.heroes.map(h=>h.name).filter(n=>!cur.includes(n)).sort((a,b)=>a.localeCompare(b,'ru'));
  const val = prompt('Добавьте героя по имени (доступно всех: '+avail.length+').\nВведите точное имя, например: '+avail[0]);
  if(!val) return;
  const name = avail.find(n=>n.toLowerCase()===val.trim().toLowerCase());
  if(!name){ toast('Герой не найден: '+val); return; }
  (ROSTER[i].heroes = ROSTER[i].heroes||[]).push(name);
  saveRoster(); renderRoster();
}
function delHero(i,j){ ROSTER[i].heroes.splice(j,1); saveRoster(); renderRoster(); }
function addBuild(i){ (ROSTER[i].builds = ROSTER[i].builds||[]).push({}); saveRoster(); renderRoster(); }
function setB(i,j,k,v){ ROSTER[i].builds[j][k]=v; saveRoster(); }
function delBuild(i,j){ ROSTER[i].builds.splice(j,1); saveRoster(); renderRoster(); }
function exportRoster(){
  const blob = new Blob([JSON.stringify(ROSTER, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (LS.get('clanName','Wild Hunt').replace(/\s+/g,'-')) + '-состав.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importRoster(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ try{
      const arr = JSON.parse(r.result);
      if(!Array.isArray(arr)) throw 0;
      ROSTER = arr; saveRoster(); renderRoster(); toast('Состав загружен: '+arr.length+' бойцов');
    }catch(e){ toast('Не удалось прочитать файл'); } };
    r.readAsText(f);
  };
  inp.click();
}

        <span class="dt">${esc(e.date)} ${esc(e.time||'')}</span>
        <span class="pill">${esc(e.type||'')}</span>
        <span class="tt">${esc(e.title||'')}</span>
        <span class="who">${esc(e.who||'')}</span>
        <button class="btn mini danger" style="margin-left:8px" onclick="delEvent(${e.id})">✕</button>

function addEvent(){

    title:$('#evTitle').value.trim()||'Событие', who:$('#evWho').value.trim()});
  LS.set('events', EVENTS); renderEvents();
}
function delEvent(id){ EVENTS = EVENTS.filter(e=>e.id!==id); LS.set('events',EVENTS); renderEvents(); }

const SLOTS = [['top','Топ состав'],['start','Состав на старте'],['rec','Рекомендованный состав']];
function compKey(bid,k){ return 'comp_'+bid+'_'+k; }
function compChips(key,list){
  return list.map(n=>`<span class="pillchip">${heroChip(n)}<button class="x" title="Убрать" onclick="rmComp('${key}',this.dataset.n)" data-n="${esc(n)}">✕</button></span>`).join('')
    || '<span class="muted small">Пока пусто — выберите героев выше</span>';
}
function compHTML(bid){
  return `<div class="comps">${SLOTS.map(([k,label])=>{
    const key=compKey(bid,k); const list=LS.get(key,[]);
    return `<div class="panel comp"><h4>${label}</h4>
      <div class="compline"><select id="sel-${key}">${D.data.heroes.map(h=>`<option>${esc(h.name)}</option>`).join('')}</select>
      <button class="btn mini" onclick="addComp('${key}')">+ Добавить</button>
      
      <button class="btn mini danger" onclick="clearComp('${key}')">Очистить</button></div>
      <div class="chips" id="chips-${key}">${compChips(key,list)}</div></div>`;
  }).join('')}</div>`;
}
function randComp(key){
  const bid=(BOSSES.find(b=>key.startsWith(b.id+'_'))||{}).id||'';
  const hs=D.data.heroes.slice();
  const numv=v=>parseInt(String(v).replace(/\D/g,''))||0;
  const has=(h,t)=>String(h.abilities||'').includes(t);
  const isHealer=h=>/исцел|леч[аи]|восстанов|регенер/i.test(String(h.abilities||''));
  const isDebuff=h=>/Заморозка|Кровотечени|Яд|Штраф|Ослаб|Проклят|Оглушени|Сон|Молчание|Немота|DEF Down|ATK Down|Слабост/i.test(String(h.abilities||''));
  let pool=hs.slice(); const picks=[];
  const take=h=>{ if(!h) return false; const i=pool.indexOf(h); if(i<0) return false;
    pool.splice(i,1); picks.push(h); return true; };
  const byName=n=>hs.find(h=>h.name===n);
  const ban=[], force=[]; let freeze=false, pure=false;
  if(bid==='goldguard'){ force.push('Anubis','Hound of Duat','Set','Beowulf'); ban.push('Skadi'); }
  if(bid==='fafnir'){ freeze=true; }
  if(bid==='luktor'){ pure=true; }
  pool=pool.filter(h=>!ban.includes(h.name));
  force.forEach(n=>take(byName(n)));
  if(pure) pool=pool.filter(h=>!isDebuff(h));
  if(!picks.some(h=>h.archetype==='Защитник'))
    take(pool.filter(h=>h.archetype==='Защитник').sort((a,b)=>numv(b.def)-numv(a.def))[0]);
  if(!picks.some(isHealer))
    take(pool.filter(isHealer).sort((a,b)=>numv(b.hp)-numv(a.hp))[0]);
  let rest=pool.slice();
  if(freeze){ const fz=rest.filter(h=>has(h,'[Заморозка]')); fz.forEach(h=>{take(h); rest=rest.filter(x=>x!==h);}); }
  rest.sort((a,b)=>numv(b.atk)-numv(a.atk));
  rest.slice(0,Math.max(0,5-picks.length)).forEach(h=>picks.push(h));
  if(picks.length<5){ const extra=hs.filter(h=>!picks.includes(h)&&!ban.includes(h.name))
    .sort((a,b)=>numv(b.atk)-numv(a.atk)); extra.slice(0,5-picks.length).forEach(h=>picks.push(h)); }
  const names=picks.slice(0,5).map(h=>h.name);
  LS.set(key,names);
  const el=document.getElementById('chips-'+key);
  if(el) el.innerHTML=compChips(key,names);
  toast('Состав собран 🎲');
}
function addComp(key){
  const v=document.getElementById('sel-'+key).value;
  const list=LS.get(key,[]);
  if(list.includes(v)){ toast('Уже в составе'); return; }
  if(list.length>=5){ toast('Максимум 5 героев'); return; }
  list.push(v); LS.set(key,list);
  document.getElementById('chips-'+key).innerHTML=compChips(key,list);
  toast('Добавлено: '+v);
}
function rmComp(key,n){
  const list=LS.get(key,[]).filter(x=>x!==n); LS.set(key,list);
  document.getElementById('chips-'+key).innerHTML=compChips(key,list);
}
function clearComp(key){ LS.set(key,[]); document.getElementById('chips-'+key).innerHTML=compChips(key,[]); }

const NAMES_RE=(()=>{ const ns=Object.keys(HERO).sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); return new RegExp('(?<![\\p{L}])('+ns.join('|')+')(?![\\p{L}])','gu'); })();
function hl(t){ return esc(t).replace(NAMES_RE, m=>heroChip(m)); }
function bindNotes(root){ root.querySelectorAll('textarea[id^="nt-"]').forEach(t=>t.addEventListener('input',()=>LS.set('note_'+t.id.slice(3), t.value))); }
function bossCard(b){
  return `<div class="panel boss"><h3>${b.emoji} ${b.name}</h3>
  <p class="tagline">${esc(b.tagline)}</p>
  <h4>Суть боя</h4><p>${hl(b.core)}</p>
  <h4>${b.roles?'Роли':'Механики'}</h4><ul>${b.mech.map(m=>'<li>'+hl(m)+'</li>').join('')}</ul>
  ${compHTML(b.id)}
  <div class="notesbox"><h4>Заметки клана</h4><textarea id="nt-${b.id}" placeholder="Тактика, тайминги, кто что держит...">${esc(LS.get('note_'+b.id,''))}</textarea></div></div>`;
}
const GEARS=[['Оружие','sub-weapons','renderWeapons'],['Сеты','sub-sets','renderSets'],['Импринты','sub-imprints','renderImprints'],['Эффекты','sub-effects','renderEffects']];
let curGear=0, curBoss=0, curHeroSub=0;
function subsMark(el,idx){ el.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===idx)); }
function buildGear(){
  $('#gearSubTabs').innerHTML=GEARS.map(g=>`<button data-t="${g[0]}" onclick="pickGear(GEARS.findIndex(x=>x[0]==='${g[0]}'))">${g[0]}</button>`).join('');
  pickGear(LS.get('gearSub',0));
}
function pickGear(i){ curGear=i; LS.set('gearSub',i);
  GEARS.forEach(g=>document.getElementById(g[1]).style.display='none');
  window[GEARS[i][2]](); document.getElementById(GEARS[i][1]).style.display='block';
  subsMark($('#gearSubTabs'),i);
}
function renderBosses(){
  $('#bossSubTabs').innerHTML=BOSSES.map((b,i)=>`<button data-t="${b.name}" onclick="pickBoss(${i})">${b.emoji} ${b.name}</button>`).join('');
  pickBoss(LS.get('bossSub',0));
}
function pickBoss(i){ curBoss=i; LS.set('bossSub',i);
  $('#bossPane').innerHTML=bossCard(BOSSES[i]); bindNotes($('#bossPane'));
  subsMark($('#bossSubTabs'),i);
}
function renderClanBoss(){
  $('#clanPane').innerHTML=bossCard(CLANBOSS); bindNotes($('#clanPane'));
}
const HEROSUBS=[['Герои','sub-heroes','renderHeroGrid'],['Тир-лист','sub-tl','renderTier']];
function buildHeroSubs(){
  $('#heroSubTabs').innerHTML=HEROSUBS.map(s=>`<button data-t="${s[0]}" onclick="pickHeroSub(HEROSUBS.findIndex(x=>x[0]==='${s[0]}'))">${s[0]}</button>`).join('');
  pickHeroSub(LS.get('heroSub',0));
}
function pickHeroSub(i){ curHeroSub=i; LS.set('heroSub',i);
  HEROSUBS.forEach(s=>document.getElementById(s[1]).style.display='none');
  window[HEROSUBS[i][2]](); document.getElementById(HEROSUBS[i][1]).style.display='block';
  subsMark($('#heroSubTabs'),i);
}

initNav(); initBrand(); renderHome();
